# Robô do GitHub: a cada push na main, monta o APK assinado, atualiza o version.json
# e publica o app (index.html) no site do GitHub Pages.
name: Gerar APK e publicar o app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # salvar o APK no repositório
  pages: write      # publicar o site
  id-token: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Número da versão (data e hora)
        run: |
          echo "V=$(TZ=America/Sao_Paulo date +%Y%m%d%H%M)" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Atualizar version.json
        run: python3 .github/scripts/version.py

      - name: Colocar a cópia offline do app dentro do APK
        run: |
          mkdir -p android/app/src/main/assets
          cp web/index.html android/app/src/main/assets/index.html
          cp web/version.json android/app/src/main/assets/version.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Chave de assinatura (vem dos segredos do GitHub)
        env:
          KB: ${{ secrets.KEYSTORE_BASE64 || vars.KEYSTORE_BASE64 }}
          KP: ${{ secrets.KEYSTORE_PASSWORD || vars.KEYSTORE_PASSWORD }}
        run: python3 .github/scripts/chave.py

      - name: Montar o APK assinado
        run: |
          set -o pipefail
          gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Guardar o APK no repositório e no site
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/release/app-release.apk apk/JJGlasses.apk
          cp apk/JJGlasses.apk web/JJGlasses.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add apk/JJGlasses.apk web/version.json
          git commit -m "APK ${VERSION_NAME} e versão ${V} [skip ci]" || echo "nada novo"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Guardar o relatório de erro (para o Claude ler)
        if: failure()
        env:
          TOKEN: ${{ github.token }}
          KB: ${{ secrets.KEYSTORE_BASE64 || vars.KEYSTORE_BASE64 }}
          KP: ${{ secrets.KEYSTORE_PASSWORD || vars.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/rel" && cd "$RUNNER_TEMP/rel"
          {
            echo "tamanho KEYSTORE_BASE64 (sem espacos): $(printf '%s' "$KB" | tr -d ' \r\n\t' | wc -c) (esperado 3520)"
            echo "tamanho KEYSTORE_PASSWORD: $(printf '%s' "$KP" | wc -c) (esperado 24)"
            printf '%s' "$KB" | tr -d ' \r\n\t' | base64 -d > k.jks 2>/dev/null && echo "base64 ok, $(wc -c < k.jks) bytes (esperado 2638)" || echo "base64 INVALIDO"
            keytool -list -keystore k.jks -storepass "$KP" >/dev/null 2>&1 && echo "senha confere com a chave" || echo "senha NAO confere"
            rm -f k.jks
            ls -la "$GITHUB_WORKSPACE"/android/app/build/outputs/apk/release 2>/dev/null || true
          } > diagnostico.txt 2>&1 || true
          git init -q && git checkout -q -b relatorio-build
          if [ -f "$RUNNER_TEMP/build.log" ]; then tail -c 80000 "$RUNNER_TEMP/build.log" > build.log; else echo "Falhou antes de montar o APK (veja a aba Actions)." > build.log; fi
          echo "run ${GITHUB_RUN_NUMBER} commit ${GITHUB_SHA}" > info.txt
          cat "$GITHUB_WORKSPACE/web/version.json" >> diagnostico.txt 2>/dev/null || true
          git add . && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "relatório do build ${GITHUB_RUN_NUMBER}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" relatorio-build
